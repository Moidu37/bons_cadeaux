  :root{
    --pink:#d9539b;
    --blue:#2f9bdc;
    --teal:#6fcdc0;
    --ink:#2b2b2b;
    --bg:#f6f2f0;
    --card:#ffffff;
    --border:#e7dfdd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(160deg,#fdf3f6,#eef7fb 60%,#f6f2f0);
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 80px;
  }
  h1{
    text-align:center;
    font-weight:600;
    font-size:1.5rem;
    margin:0 0 4px;
  }
  p.subtitle{
    text-align:center;
    color:#7a7a7a;
    margin:0 0 32px;
    font-size:0.95rem;
  }
  .wrap{
    max-width:1200px;
    margin:0 auto;
    display:grid;
    grid-template-columns:380px 1fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;}
  }
  .panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
    box-shadow:0 10px 30px -18px rgba(0,0,0,0.25);
  }
  label{
    display:block;
    font-size:0.82rem;
    font-weight:600;
    margin:16px 0 6px;
    color:#555;
  }
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=date], select{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #dcd4d2;
    font-family:'Poppins',sans-serif;
    font-size:0.92rem;
    background:#fbfafa;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
    background:#fff;
  }
  .field-group{
    border-left:3px solid var(--teal);
    padding-left:12px;
    margin-top:18px;
  }
  .hidden{display:none !important;}
  .downloads{
    margin-top:24px;
    display:flex;
    gap:10px;
  }
  .downloads button{
    flex:1;
    padding:13px 12px;
    border-radius:12px;
    border:none;
    background:linear-gradient(120deg,var(--pink),var(--blue));
    color:#fff;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:0.92rem;
    cursor:pointer;
    letter-spacing:0.2px;
    box-shadow:0 8px 18px -8px rgba(217,83,155,0.6);
  }
  .downloads button:active{transform:translateY(1px);}
  .preview-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  #cardCanvas{
    width:100%;
    height:auto;
    border-radius:10px;
    box-shadow:0 14px 40px -20px rgba(0,0,0,0.4);
    background:#fff;
  }
  .status{
    font-size:0.8rem;
    color:#8a8a8a;
    text-align:center;
  }
  .badge{
    display:inline-block;
    font-size:0.7rem;
    background:#fdeef5;
    color:var(--pink);
    padding:2px 8px;
    border-radius:20px;
    margin-left:6px;
    font-weight:600;
  }
</style>
</head>
<body>

<h1>Générateur de carte cadeau</h1>
<p class="subtitle">Charlotte Boisseau — Photographe</p>

<div class="wrap">

  <form class="panel" id="cardForm">
    <label for="carteNum">Numéro de carte</label>
    <input type="text" id="carteNum" placeholder="ex : 11398" inputmode="numeric" required>

    <label for="validite">Date de validité</label>
    <input type="date" id="validite" required>

    <label for="offertA">Offert à</label>
    <input type="text" id="offertA" placeholder="Nom du bénéficiaire">

    <label for="deLaPartDe">De la part de</label>
    <input type="text" id="deLaPartDe" placeholder="Nom de l'offreur">

    <label for="typePrestation">Type de prestation</label>
    <select id="typePrestation">
      <option value="seance">Séance photo</option>
      <option value="cours">Cours de photo</option>
    </select>

    <div class="field-group" id="groupSeance">
      <label for="formuleSeance">Formule</label>
      <select id="formuleSeance">
        <option value="standard">Séance Lifestyle</option>
        <option value="mini">Mini séance (30min)</option>
      </select>

      <div id="seanceStandardFields">
        <label for="dureeSeance">Durée</label>
        <select id="dureeSeance">
          <option value="1h">1h</option>
          <option value="2h">2h</option>
        </select>

        <label for="nbPhotosSeance">Nombre de photos</label>
        <select id="nbPhotosSeance"></select>

        <label for="lieuSeance">Lieu</label>
        <select id="lieuSeance">
          <option value="saintavertin">À Saint Avertin</option>
          <option value="deplacement">Déplacement inclus (10km)</option>
          <option value="domicile">À domicile</option>
          <option value="autre">Autre</option>
        </select>
        <input type="text" id="lieuSeanceAutre" class="hidden" placeholder="Précisez le lieu" style="margin-top:8px;">
      </div>
    </div>

    <div class="field-group hidden" id="groupCours">
      <label for="lieuCours">Lieu</label>
      <select id="lieuCours">
        <option value="saintavertin">À Saint Avertin</option>
        <option value="deplacement">Déplacement inclus (10km)</option>
        <option value="domicile">À domicile</option>
        <option value="autre">Autre</option>
      </select>
      <input type="text" id="lieuAutre" class="hidden" placeholder="Précisez le lieu" style="margin-top:8px;">

      <label for="nbPersonnes">Nombre de personnes</label>
      <select id="nbPersonnes">
        <option value="1">1 personne</option>
        <option value="2">2 personnes</option>
        <option value="3">3 personnes</option>
        <option value="4">4 personnes</option>
      </select>

      <label for="nbHeures">Durée</label>
      <select id="nbHeures">
        <option value="2h">2h</option>
        <option value="3h">3h</option>
        <option value="4h">4h</option>
      </select>

      <label for="nbCours">Nombre de cours</label>
      <select id="nbCours">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </div>

    <label for="commentaire">Message complémentaire (optionnel)</label>
    <input type="text" id="commentaire" placeholder="Ex : Joyeux anniversaire ! (s'affiche sous le lieu)">

    <div class="downloads" id="downloadRow">
      <button type="button" id="dlPng">⬇ Image (JPG)</button>
      <button type="button" id="dlPdf">⬇ PDF</button>
    </div>
  </form>
  </form>

  <div class="panel preview-panel">
    <canvas id="cardCanvas" width="2560" height="1280"></canvas>
    <div class="status" id="statusText">Remplissez le formulaire puis cliquez sur « Générer la carte cadeau »<span class="badge">aperçu en direct</span></div>
  </div>

const bgImage = new Image();
bgImage.src = CARD_BACKGROUND_DATA_URI;

const canvas = document.getElementById('cardCanvas');
const ctx = canvas.getContext('2d');

const typeSelect = document.getElementById('typePrestation');
const groupSeance = document.getElementById('groupSeance');
const groupCours = document.getElementById('groupCours');
const downloadRow = document.getElementById('downloadRow');
const statusText = document.getElementById('statusText');

typeSelect.addEventListener('change', () => {
  const isSeance = typeSelect.value === 'seance';
  groupSeance.classList.toggle('hidden', !isSeance);
  groupCours.classList.toggle('hidden', isSeance);
  scheduleLivePreview();
});

const lieuCoursSelect = document.getElementById('lieuCours');
const lieuAutreInput = document.getElementById('lieuAutre');
lieuCoursSelect.addEventListener('change', () => {
  lieuAutreInput.classList.toggle('hidden', lieuCoursSelect.value !== 'autre');
  scheduleLivePreview();
});

// --- Séance photo : formule mini vs standard ---
const formuleSeanceSelect = document.getElementById('formuleSeance');
const seanceStandardFields = document.getElementById('seanceStandardFields');
const dureeSeanceSelect = document.getElementById('dureeSeance');
const nbPhotosSeanceSelect = document.getElementById('nbPhotosSeance');
const lieuSeanceSelect = document.getElementById('lieuSeance');
const lieuSeanceAutreInput = document.getElementById('lieuSeanceAutre');

formuleSeanceSelect.addEventListener('change', () => {
  seanceStandardFields.classList.toggle('hidden', formuleSeanceSelect.value === 'mini');
  scheduleLivePreview();
});

function updateNbPhotosOptions(){
  const n = dureeSeanceSelect.value === '1h' ? 15 : 25;
  nbPhotosSeanceSelect.innerHTML =
    `<option value="${n}">${n} photos numériques au choix</option>` +
    `<option value="toutes">Toutes les photos numériques</option>`;
}
dureeSeanceSelect.addEventListener('change', () => {
  updateNbPhotosOptions();
  scheduleLivePreview();
});
updateNbPhotosOptions();

lieuSeanceSelect.addEventListener('change', () => {
  lieuSeanceAutreInput.classList.toggle('hidden', lieuSeanceSelect.value !== 'autre');
  scheduleLivePreview();
});

function formatDateFR(isoDate){
  if(!isoDate) return '';
  const [y,m,d] = isoDate.split('-');
  return `${d}/${m}/${y}`;
}

function seanceLieuPhrase(selectEl, autreInput){
  const sel = selectEl.value;
  if(sel === 'saintavertin') return 'À Saint Avertin';
  if(sel === 'deplacement') return 'Déplacement inclus de 10 km autour de Saint Avertin';
  if(sel === 'domicile') return 'À domicile';
  return autreInput.value || 'À définir';
}

function getDescriptionLines(){
  if(typeSelect.value === 'seance'){
    if(formuleSeanceSelect.value === 'mini'){
      return [
        '1 mini Séance Photo Lifestyle de 30min, pour 1 personne',
        '5 photos numériques incluses, Galerie web',
        'Lieu : St Avertin'
      ];
    }
    const duree = dureeSeanceSelect.value; // '1h' ou '2h'
    const dureePhrase = duree === '1h' ? '1 Séance Photo Lifestyle de 1h' : '1 Séance Photo Lifestyle de 2h';
    const nbPhotos = nbPhotosSeanceSelect.value;
    const nbPhotosPhrase = nbPhotos === 'toutes'
      ? 'Toutes les photos numériques incluses, Galerie Web'
      : `${nbPhotos} photos numériques incluses au choix, Galerie Web`;
    const lieuPhrase = seanceLieuPhrase(lieuSeanceSelect, lieuSeanceAutreInput);
    return [dureePhrase, nbPhotosPhrase, `Lieu : ${lieuPhrase}`];
  } else {
    const nbCours = document.getElementById('nbCours').value;
    const duree = document.getElementById('nbHeures').value;
    const nbPers = parseInt(document.getElementById('nbPersonnes').value, 10);
    const persLabel = nbPers > 1 ? `${nbPers} personnes` : '1 personne';
    const coursLabel = parseInt(nbCours,10) > 1 ? `${nbCours} Cours de Photographie particulier` : '1 Cours de Photographie particulier';

    const lieuSel = document.getElementById('lieuCours').value;
    let lieuText;
    if(lieuSel === 'saintavertin') lieuText = 'St Avertin';
    else if(lieuSel === 'deplacement') lieuText = 'Déplacement inclus de 10 km autour de Saint Avertin';
    else if(lieuSel === 'domicile') lieuText = 'À domicile';
    else lieuText = document.getElementById('lieuAutre').value || 'À définir';

    return [
      `${coursLabel} de ${duree} pour ${persLabel}`,
      'Thème au choix (prise en main de son appareil, portrait, vitesse...)',
      `Lieu : ${lieuText}`
    ];
  }
}

function fitFontSize(text, maxWidth, baseSize, family, weight){
  let size = baseSize;
  ctx.font = `${weight} ${size}px ${family}`;
  while(ctx.measureText(text).width > maxWidth && size > 12){
    size -= 1;
    ctx.font = `${weight} ${size}px ${family}`;
  }
  return size;
}

const SCRIPT_FONT = `'Bellerose', 'Caveat', cursive`;
const CARD_ACCENT = '#2f9bdc'; // couleur unique partagée par le numéro, la validité et les lignes centrales

function descLayoutFor(n){
  // Coordonnées repérées sur le nouveau visuel (canvas 2560x1280)
  if(n <= 3) return { y: [585, 653, 719], baseSize: 60 };
  // Espacement régulier (~62px, proche de celui des 3 lignes) centré sur la même zone,
  // sans chevaucher le nuage aquarelle au-dessus ni le "Carte n°" en dessous.
  return { y: [566, 628, 690, 752], baseSize: 46 };
}

function drawCard(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

  const carteNum = document.getElementById('carteNum').value || '—';
  const validite = formatDateFR(document.getElementById('validite').value) || '—';
  const offertA = document.getElementById('offertA').value || '';
  const deLaPartDe = document.getElementById('deLaPartDe').value || '';
  const commentaire = document.getElementById('commentaire').value.trim();

  const lines = getDescriptionLines();
  if(commentaire) lines.push(commentaire); // 4e ligne optionnelle, sous le lieu

  // Couvre le texte d'exemple du bloc description (le reste du gabarit est déjà vierge :
  // les lignes "Offert à" / "De la part de" / "Carte n°" / "Validité" sont de simples soulignés).
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(1290, 500, 1220, 280); // bloc description (3 ou 4 lignes)

  // --- "Offert à" value (noir, posé juste au-dessus du souligné) ---
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#000000';
  let fs = fitFontSize(offertA, 620, 44, "'Poppins'", 500);
  ctx.font = `500 ${fs}px 'Poppins'`;
  ctx.fillText(offertA, 1960, 273);

  // --- "De la part de" value (noir, posé juste au-dessus du souligné) ---
  fs = fitFontSize(deLaPartDe, 560, 44, "'Poppins'", 500);
  ctx.font = `500 ${fs}px 'Poppins'`;
  ctx.fillText(deLaPartDe, 1985, 336);

  // --- Description lines (police Bellerose, avec repli Caveat) ---
  // Toutes les lignes partagent la même taille de police (la plus petite nécessaire) pour un rendu homogène,
  // et la mise en page (nombre de lignes / espacement) s'adapte si la 4e ligne (commentaire) est présente.
  ctx.textAlign = 'center';
  ctx.fillStyle = CARD_ACCENT;
  const layout = descLayoutFor(lines.length);
  const commonSize = Math.min(...lines.map(line => fitFontSize(line, 1160, layout.baseSize, SCRIPT_FONT, 700)));
  ctx.font = `700 ${commonSize}px ${SCRIPT_FONT}`;
  lines.forEach((line, i) => {
    ctx.fillText(line, 1917, layout.y[i]);
  });

  // --- Carte n° (centré au-dessus du souligné, même couleur que le reste) ---
  ctx.textAlign = 'center';
  ctx.fillStyle = CARD_ACCENT;
  let numSize = fitFontSize(carteNum, 150, 50, SCRIPT_FONT, 700);
  ctx.font = `700 ${numSize}px ${SCRIPT_FONT}`;
  ctx.fillText(carteNum, 1750, 858);

  // --- Validité (centré au-dessus du souligné, même couleur que le reste) ---
  let valSize = fitFontSize(validite, 180, 50, SCRIPT_FONT, 700);
  ctx.font = `700 ${valSize}px ${SCRIPT_FONT}`;
  ctx.fillText(validite, 2225, 858);
}

let liveTimer = null;
function scheduleLivePreview(){
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => {
    if(bgImage.complete) drawCard();
  }, 120);
}

document.querySelectorAll('input, select').forEach(el => {
  el.addEventListener('input', scheduleLivePreview);
  el.addEventListener('change', scheduleLivePreview);
});

bgImage.onload = () => {
  drawCard();
};

function currentFileBase(){
  const num = document.getElementById('carteNum').value || 'carte';
  return `carte-cadeau-${num}`;
}

function downloadJPG(){
  drawCard(); // s'assure que le rendu est à jour avant l'export
  const link = document.createElement('a');
  link.download = currentFileBase() + '.jpg';
  link.href = canvas.toDataURL('image/jpeg', 0.95);
  link.click();
  statusText.textContent = 'Image JPG téléchargée ✓';
}

function downloadPDF(){
  drawCard(); // s'assure que le rendu est à jour avant l'export
  const { jsPDF } = window.jspdf;
  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  const pdf = new jsPDF({
    orientation: 'landscape',
    unit: 'mm',
    format: [297, 148.6] // ratio proche de l'image de la carte
  });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  pdf.addImage(imgData, 'JPEG', 0, 0, pageWidth, pageHeight);
  pdf.save(currentFileBase() + '.pdf');
  statusText.textContent = 'PDF téléchargé ✓';
}

document.getElementById('dlPng').addEventListener('click', downloadJPG);
document.getElementById('dlPdf').addEventListener('click', downloadPDF);

document.getElementById('cardForm').addEventListener('submit', (e) => e.preventDefault());
</script>
